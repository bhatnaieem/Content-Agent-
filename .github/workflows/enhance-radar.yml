name: Enhance CryptoPulse Radar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[radar-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade radar UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/page.tsx')
          text = p.read_text()

          text = text.replace(
              'interface Story { headline:string; category:string; score:number; format:"thread"|"single post"; reason:string; summary:string; keywords:string[]; hashtags:string[]; sources:string[]; posting_time_utc:string; cta:string; graphic_prompt:string; alt_text:string; thread:{title:string;tweets:string[]}; engagement:{reply:string;quote_tweet:string;poll:string;blog_expansion:string}; }',
              'interface SourceDetail { name:string; url:string; published_at:string; }\ninterface Story { headline:string; category:string; score:number; format:"thread"|"single post"; reason:string; summary:string; keywords:string[]; hashtags:string[]; sources:string[]; source_details?:SourceDetail[]; posting_time_utc:string; cta:string; graphic_prompt:string; alt_text:string; thread:{title:string;tweets:string[]}; engagement:{reply:string;quote_tweet:string;poll:string;blog_expansion:string}; }'
          )

          text = text.replace(
              'type Narrative = { name:string; count:number; score:number; keywords:string[] };',
              'type Narrative = { name:string; count:number; score:number; avgScore:number; keywords:string[]; stories:Story[]; sourceCount:number; freshestSource:string; };'
          )

          start = text.index('function Radar(')
          end = text.index('function VisualPackage', start)

          new_radar = r'''function Radar({narratives,stories,switchTab}:{narratives:Narrative[];stories:Story[];switchTab:(tab:Tab)=>void}){
 const totalSources=stories.reduce((n,s)=>n+(s.source_details?.filter(x=>x.url||x.name).length||s.sources?.length||0),0);
 const datedSources=stories.flatMap(s=>s.source_details||[]).filter(x=>x.published_at);
 const freshest=datedSources.sort((a,b)=>new Date(b.published_at).getTime()-new Date(a.published_at).getTime())[0]?.published_at;
 const fmtDate=(value:string)=>{if(!value)return "Date unavailable";const d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
 const sourceLabel=(x:SourceDetail)=>x.name||(()=>{try{return new URL(x.url).hostname.replace(/^www\./,"")}catch{return "Source"}})();
 return <><div className="cp-section-head"><div><div className="cp-kicker"><TrendingUp size={12}/> Signal intelligence</div><h2>Narrative Radar</h2><p>Ranked themes based on impact, story coverage, freshness and source evidence — not just category labels.</p></div></div>
 { !stories.length?<div className="cp-empty"><div className="cp-empty-icon"><TrendingUp size={25}/></div><h3>No narratives yet</h3><p>Run a briefing to populate the radar.</p></div>:<>
 <div className="cp-radar-overview"><div className="cp-radar-stat"><span>Active narratives</span><strong>{narratives.length}</strong><small>themes in this briefing</small></div><div className="cp-radar-stat"><span>Source coverage</span><strong>{totalSources}</strong><small>source references attached</small></div><div className="cp-radar-stat"><span>Avg. impact</span><strong>{Math.round(stories.reduce((a,s)=>a+(s.score||0),0)/stories.length)}</strong><small>out of 100</small></div><div className="cp-radar-stat"><span>Freshest evidence</span><strong>{freshest?fmtDate(freshest):"—"}</strong><small>when publication date is available</small></div></div>
 <div className="cp-radar-grid">{narratives.map((n:Narrative)=>{const fresh=n.freshestSource?fmtDate(n.freshestSource):"Date unavailable";return <article className="cp-radar" key={n.name}>
   <div className="cp-radar-top"><div className="cp-radar-icon"><TrendingUp size={18}/></div><span className="cp-badge cyan">{n.count} {n.count===1?"story":"stories"}</span></div>
   <h3>{n.name}</h3>
   <div className="cp-radar-score-row"><div><div className="cp-radar-score">{n.score}<span>/100</span></div><small>Signal score</small></div><div className="cp-radar-mini"><span>Avg impact</span><b>{n.avgScore}</b></div><div className="cp-radar-mini"><span>Sources</span><b>{n.sourceCount}</b></div></div>
   <div className="cp-bar"><span style={{width:`${Math.min(n.score,100)}%`}}/></div>
   <div className="cp-radar-meta"><span><Clock3 size={11}/> Freshest: {fresh}</span><span>{n.sourceCount?"Evidence attached":"No source metadata"}</span></div>
   <div className="cp-keywords">{Array.from(new Set(n.keywords)).slice(0,5).map((k:string)=><span className="cp-keyword" key={k}>{k}</span>)}</div>
   <div className="cp-radar-stories">{n.stories.slice(0,3).map((s:Story,i:number)=><button key={i} onClick={()=>switchTab("briefing")}><span className="cp-radar-story-score">{s.score}</span><span className="cp-radar-story-title">{s.headline}</span></button>)}</div>
   <div className="cp-radar-sources"><div className="cp-radar-source-head"><span>Evidence</span><span>{n.sourceCount} source{n.sourceCount===1?"":"s"}</span></div>{n.stories.flatMap((s:Story)=>s.source_details||[]).filter((x:SourceDetail)=>x.name||x.url).slice(0,4).map((x:SourceDetail,i:number)=><div className="cp-source-row" key={`${x.url}-${i}`}><div><b>{sourceLabel(x)}</b><small>{x.published_at?fmtDate(x.published_at):"Publication date unavailable"}</small></div>{x.url?<a href={x.url} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()}>Open ↗</a>:<span className="cp-source-muted">No URL</span>}</div>)}</div>
 </article>})}</div>
 </>}
 </>}
function VisualPackage'''

          text = text[:start] + new_radar + text[end + len('function VisualPackage'):]
          p.write_text(text)
      - name: Add radar styles
        shell: bash
        run: |
          cat >> app/globals.css <<'EOF'

/* CryptoPulse Radar upgrade */
.cp-radar-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.cp-radar-stat{border:1px solid #dbe4ee;background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 22px rgba(15,23,42,.04)}
.cp-radar-stat span,.cp-radar-stat small{display:block;color:#64748b;font-size:10px}.cp-radar-stat strong{display:block;margin:5px 0 2px;color:#172033;font-size:21px}.cp-radar-grid{align-items:start}.cp-radar{cursor:default;text-align:left}.cp-radar-top{display:flex;align-items:center;justify-content:space-between}.cp-radar-score-row{display:flex;gap:18px;align-items:end;margin:12px 0 8px}.cp-radar-score-row small{color:#94a3b8;font-size:9px}.cp-radar-mini{display:flex;flex-direction:column;gap:2px}.cp-radar-mini span{font-size:9px;color:#94a3b8}.cp-radar-mini b{font-size:14px;color:#334155}.cp-radar-meta{display:flex;justify-content:space-between;gap:8px;margin:9px 0;color:#64748b;font-size:9px}.cp-radar-meta span{display:flex;align-items:center;gap:4px}.cp-radar-stories{display:grid;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid #e8edf3}.cp-radar-stories button{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;border:0;background:#f8fafc;border-radius:9px;padding:8px;text-align:left;cursor:pointer}.cp-radar-story-score{font-size:10px;font-weight:800;color:#0f766e}.cp-radar-story-title{font-size:10px;line-height:1.35;color:#334155}.cp-radar-sources{margin-top:12px;padding-top:10px;border-top:1px solid #e8edf3}.cp-radar-source-head{display:flex;justify-content:space-between;margin-bottom:6px;color:#64748b;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.cp-source-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #f1f5f9}.cp-source-row div{min-width:0}.cp-source-row b,.cp-source-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cp-source-row b{font-size:10px;color:#334155}.cp-source-row small{font-size:9px;color:#94a3b8;margin-top:2px}.cp-source-row a{font-size:9px;color:#0f766e;text-decoration:none;white-space:nowrap}.cp-source-muted{font-size:9px;color:#cbd5e1;white-space:nowrap}
@media(max-width:900px){.cp-radar-overview{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.cp-radar-overview{grid-template-columns:1fr 1fr}.cp-radar-score-row{gap:12px}.cp-radar-meta{flex-direction:column}}
EOF
      - name: Commit radar upgrade
        run: |
          git config user.name "CryptoPulse Bot"
          git config user.email "actions@github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade narrative radar with source evidence [radar-patch]"
          git push
